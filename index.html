<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THALES Information Systems - Inventário</title>
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
        background-color: #003366;
        color: #333;
        padding: 20px;
    }
    #login-modal {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #003366, #0055a5);
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
    }
    .login-box {
        background: #fff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        width: 100%;
        max-width: 400px;
        text-align: center;
    }
    .login-box h2 {
        color: #003366;
        margin-bottom: 5px;
    }
    .login-box p {
        font-size: 13px;
        color: #666;
        margin-bottom: 20px;
    }
    .input-group {
        margin-bottom: 15px;
        text-align: left;
    }
    .input-group label {
        display: block;
        margin-bottom: 5px;
        font-size: 13px;
        font-weight: bold;
        color: #444;
    }
    .input-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
        outline: none;
    }
    .input-group input:focus {
        border-color: #0055a5;
        box-shadow: 0 0 5px rgba(0, 85, 165, 0.3);
    }
    .btn-login {
        width: 100%;
        padding: 11px;
        background-color: #003366;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s;
    }
    .btn-login:hover {
        background-color: #002244;
    }
    #app-container {
        max-width: 1200px;
        margin: 0 auto;
    }
    h1 {
        color: #ffffff;
        margin-bottom: 20px;
        font-size: 24px;
    }
    #inventory-form {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
        background: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        flex-wrap: wrap;
    }
    #inventory-form input, #inventory-form select {
        flex: 1;
        min-width: 150px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
        outline: none;
    }
    #inventory-form button {
        background-color: #28a745;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s;
    }
    #inventory-form button:hover {
        background-color: #218838;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    table th, table td {
        padding: 12px 15px;
        text-align: left;
        border-bottom: 1px solid #eee;
        font-size: 14px;
    }
    table th {
        background-color: #343a40;
        color: white;
    }
    .btn-remover {
        background-color: #d9534f;
        color: white;
        border: none;
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        font-weight: bold;
    }
    .btn-remover:hover {
        background-color: #c9302c;
    }
  </style>
</head>
<body>

  <!-- Ecrã de Login -->
  <div id="login-modal">
    <div class="login-box">
      <h2>THALES</h2>
      <p>INFORMATION SYSTEMS<br>Insira suas credenciais para aceder</p>
      
      <form id="login-form" onsubmit="tentarLogin(event)">
        <div class="input-group">
          <label for="login-user">Nome de Utilizador / E-mail:</label>
          <input type="text" id="login-user" required autocomplete="off">
        </div>
        
        <div class="input-group">
          <label for="login-pass">Palavra-passe:</label>
          <input type="password" id="login-pass" required placeholder="********" autocomplete="new-password">
        </div>
        
        <button type="submit" class="btn-login">Entrar</button>
      </form>
    </div>
  </div>

  <!-- Painel Principal do Inventário -->
  <div id="app-container" style="display: none;">
    <h1>THALES Information Systems - Inventário</h1>
    
    <form id="inventory-form" onsubmit="salvarItem(event)">
      <input type="text" id="nome" placeholder="Nome do Equipamento" required>
      <input type="number" id="quantidade" placeholder="Quantidade" min="1" required>
      <select id="status" required>
        <option value="">Selecione o Status</option>
        <option value="Disponível">Disponível</option>
        <option value="Em Uso">Em Uso</option>
        <option value="Manutenção">Manutenção</option>
      </select>
      <input type="text" id="responsavel" placeholder="Responsável">
      <button type="submit">Adicionar</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Quantidade</th>
          <th>Status</th>
          <th>Responsável</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="inventory-body">
      </tbody>
    </table>
  </div>

  <script src="script.js?v=2"></script>
</body>
</html>
