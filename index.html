<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THALES Information Systems - Inventário</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <!-- Tela de Login -->
    <div id="loginScreen" class="login-container">
        <div class="login-box">
            <h2>🔐 Login - Thales</h2>
            <p>Insira as suas credenciais para aceder ao sistema</p>
            <form id="loginForm" onsubmit="realizarLogin(event)">
                <div class="input-group">
                    <label for="username">Utilizador</label>
                    <input type="text" id="username" required placeholder="Digite o utilizador">
                </div>
                <div class="input-group">
                    <label for="password">Palavra-passe</label>
                    <input type="password" id="password" required placeholder="Digite a palavra-passe">
                </div>
                <button type="submit" class="btn-login">Entrar</button>
                <p id="loginError" class="error-msg"></p>
            </form>
        </div>
    </div>

    <!-- Conteúdo Principal do Inventário -->
    <div id="appContainer" class="app-container" style="display: none;">
        <header>
            <h1>THALES Information Systems - Inventário</h1>
            <button onclick="realizarLogout()" class="btn-logout">Terminar Sessão</button>
        </header>

        <main>
            <!-- Formulário para Adicionar Item -->
            <section class="form-section">
                <form id="inventoryForm" onsubmit="salvarItem(event)">
                    <div class="form-grid-horizontal">
                        <div class="input-group">
                            <input type="text" id="itemId" required placeholder="ID">
                        </div>
                        <div class="input-group">
                            <input type="text" id="itemNome" required placeholder="Nome">
                        </div>
                        <div class="input-group">
                            <input type="number" id="itemQtd" required placeholder="Quantidade" min="0">
                        </div>
                        <div class="input-group">
                            <select id="itemStatus" required>
                                <option value="" disabled selected>Selecione o Status</option>
                                <option value="Disponível">Disponível</option>
                                <option value="Em Uso">Em Uso</option>
                                <option value="Manutenção">Manutenção</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <input type="text" id="itemResp" required placeholder="Responsável">
                        </div>
                        <button type="submit" class="btn-salvar">Adicionar</button>
                    </div>
                </form>
            </section>

            <!-- Tabela -->
            <section class="table-section">
                <div class="table-responsive">
                    <table id="inventoryTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Quantidade</th>
                                <th>Status</th>
                                <th>Responsável</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Os dados do Google Sheets aparecem aqui dinamicamente -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
